name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      YARN_NODE_LINKER: node-modules

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve Yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-node-24-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-24-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Docker metadata
        id: docker-meta
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            {
              echo "push=false"
              echo "tags=rw-girs:pr-${RUN_ID}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "main" ]; then
            if [ -z "$DOCKER_USERNAME" ]; then
              echo "DOCKER_USERNAME secret is required for main Docker publishing." >&2
              exit 1
            fi
            image="${DOCKER_USERNAME}/rw-girs"
            tags="${image}:latest"
          elif [ "$REF_TYPE" = "tag" ]; then
            if [ -z "$DOCKER_USERNAME" ]; then
              echo "DOCKER_USERNAME secret is required for tag Docker publishing." >&2
              exit 1
            fi
            image="${DOCKER_USERNAME}/rw-girs"
            version="${REF_NAME#v}"
            tags="${image}:${REF_NAME}"$'\n'"${image}:${version}"
          else
            {
              echo "push=false"
              echo "tags=rw-girs:manual-${RUN_ID}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "push=true"
            echo "tags<<EOF"
            printf "%s\n" "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to DockerHub
        if: steps.docker-meta.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.docker-meta.outputs.push == 'true' }}
          tags: ${{ steps.docker-meta.outputs.tags }}

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: write

    steps:
      - name: Resolve release metadata
        id: release-meta
        env:
          REF_NAME: ${{ github.ref_name }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          version="${REF_NAME#v}"
          {
            echo "version=${version}"
            echo "body<<EOF"
            echo "DockerHub images:"
            echo "- \`${DOCKER_USERNAME}/rw-girs:${REF_NAME}\`"
            echo "- \`${DOCKER_USERNAME}/rw-girs:${version}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.release-meta.outputs.body }}
          generate_release_notes: true
