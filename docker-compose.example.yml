services:
  rw-girs:
    image: devidian/rw-girs:latest
    container_name: rw-girs
    restart: unless-stopped
    ports:
      - "47015:47015"
    environment:
      GIRS_HOST: 0.0.0.0
      GIRS_PORT: 47015
      GIRS_PERSISTENCE_PATH: /app/data/relay-state.json
      GIRS_SAVE_INTERVAL_MS: 30000
      GIRS_LOG_LEVEL: info
    volumes:
      - rw-girs-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const WebSocket = require("ws");
          const port = process.env.GIRS_PORT || "47015";
          const socket = new WebSocket("ws://127.0.0.1:" + port + "/ws");
          const timeout = setTimeout(() => {
            socket.terminate();
            process.exit(1);
          }, 4000);
          socket.on("open", () => {
            clearTimeout(timeout);
            socket.close();
            process.exit(0);
          });
          socket.on("error", () => {
            clearTimeout(timeout);
            process.exit(1);
          });
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  rw-girs-data:
